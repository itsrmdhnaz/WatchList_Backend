
name: Deploy Watch API

on:
  push:
    branches:
      - production

permissions:
  id-token: write
  contents: read

concurrency:
  group: watch-api-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Inspect OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const payload = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString()
            );

            core.info(`OIDC sub: ${payload.sub}`);
            core.info(`OIDC aud: ${payload.aud}`);
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-3
          role-session-name: GitHubActions-WatchAPI

      - name: Send deployment command
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=watch-api-production-ec2" \
            --parameters '{"commands":["/bin/bash /usr/local/lib/watch-api/deploy.sh"],"executionTimeout":["1800"]}' \
            --timeout-seconds 300 \
            --comment "GitHub Actions production deployment" \
            --query "Command.CommandId" \
            --output text)

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "ERROR: Failed to obtain SSM Command ID."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          INSTANCE_ID=""
          STATUS=""
          DEPLOYMENT_SUCCEEDED=false

          for attempt in $(seq 1 220); do
            INSTANCE_ID=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --query "CommandInvocations[0].InstanceId" \
              --output text)

            if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
              echo "Waiting for EC2 to receive the command..."
              sleep 10
              continue
            fi

            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "CommandInvocations[0].Status" \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                DEPLOYMENT_SUCCEEDED=true
                break
                ;;

              Failed|TimedOut|Cancelled|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                echo "ERROR: Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json

                exit 1
                ;;
            esac

            sleep 10
          done

          if [[ "$DEPLOYMENT_SUCCEEDED" != "true" ]]; then
            echo "ERROR: Deployment monitoring timed out."
            exit 1
          fi

          echo "=== Deployment output ==="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "Deployment completed successfully."
      - name: Verify AWS OIDC Configuration
        uses: actions/github-script@v7
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        with:
          script: |
            const roleArn = process.env.AWS_ROLE_ARN;

            if (!roleArn) {
              core.setFailed("AWS_ROLE_ARN is empty or unavailable.");
              return;
            }

            core.info(`AWS_ROLE_ARN: ${roleArn}`);

            try {
              const token = await core.getIDToken("sts.amazonaws.com");
              core.info(`OIDC token acquired successfully (${token.length} characters).`);
            } catch (error) {
              core.setFailed(`Failed to acquire OIDC token: ${error.message}`);
            }
