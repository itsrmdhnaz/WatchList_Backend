
name: Deploy Watch API

on:
  push:
    branches:
      - production

permissions:
  id-token: write
  contents: read

concurrency:
  group: watch-api-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-3

      - name: Send deployment command
        id: deploy
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=watch-api-production-ec2" \
            --parameters 'commands=["/usr/local/lib/watch-api/deploy.sh"]' \
            --timeout-seconds 1800 \
            --comment "GitHub Actions production deployment" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment
        shell: bash
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          INSTANCE_ID=""
          STATUS=""

          for attempt in $(seq 1 120); do
            RESULT=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].[InstanceId,Status]" \
              --output text)

            if [[ -n "$RESULT" && "$RESULT" != "None" ]]; then
              read -r INSTANCE_ID STATUS <<< "$RESULT"
              echo "Deployment status: $STATUS"

              case "$STATUS" in
                Success)
                  echo "Deployment completed successfully."
                  break
                  ;;
                Failed|TimedOut|Cancelled|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                  echo "Deployment failed."
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                    --output json
                  exit 1
                  ;;
              esac
            fi

            if [[ "$attempt" -eq 120 ]]; then
              echo "Deployment monitoring timed out."
              exit 1
            fi

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
